name: training-plan-generator

services:
  postgres:
    image: postgres:16-alpine
    container_name: tpg-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - tpg_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  tpg_postgres_data:
    name: tpg_postgres_data
