server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy is the last of three layers protecting against
    # data exfiltration through the AI coach's output. The backend strips
    # Markdown media before persisting, the renderer refuses to draw images,
    # and this stops the browser reaching an attacker's host even if both fail.
    #
    # connect-src must list the API origin; update it alongside VITE_API_BASE_URL.
    # style-src needs 'unsafe-inline' because Recharts injects inline styles.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:3000; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    
    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}